<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | e-Sueldos</title>
<meta name="description" content="Ingresá a tu comunidad de e-Sueldos.">
<style>
:root{
  --blue:#4A67EA;
  --ink:#17233F;
  --text:#475467;
  --line:#D8DCE5;
  --font:"SF UI","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink)}
body{background:#fff}
a{color:inherit}
button,input{font:inherit}
.login-page{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(430px,1fr);
  gap:64px;
  padding:72px 76px;
}
.login-image{
  min-height:calc(100vh - 144px);
  border-radius:22px;
  overflow:hidden;
  position:relative;
  background:#DDE6FF;
}
.login-image img{
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  object-fit:cover;
  object-position:center;
}
.login-image::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(44,72,156,.05),rgba(255,255,255,.02));
  pointer-events:none;
}
.login-content{
  min-height:calc(100vh - 144px);
  display:flex;
  flex-direction:column;
  padding:0 0 0 0;
}
.login-logo{
  width:180px;
  height:58px;
  margin:0 0 0 0;
}
.login-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:left center;
}
.login-form-wrap{
  width:100%;
  margin:auto 0;
  transform:translateY(-2px);
}
.login-form-wrap h1{
  margin:0 0 44px;
  color:#17233F;
  font-size:32px;
  font-weight:600;
  line-height:1.12;
  letter-spacing:-1px;
}
.field label{
  display:block;
  margin-bottom:8px;
  color:#17233F;
  font-size:14px;
  font-weight:600;
}
.field input{
  width:100%;
  height:56px;
  border:1px solid var(--blue);
  border-radius:9px;
  background:#fff;
  padding:0 13px;
  color:#17233F;
  font-size:16px;
  outline:none;
}
.field input:focus{box-shadow:0 0 0 3px rgba(74,103,234,.10)}
.continue{
  width:100%;
  height:47px;
  margin-top:32px;
  border:0;
  border-radius:7px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.continue:hover{background:#3856DC}
.divider{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  margin:32px 0 28px;
  color:#667085;
  font-size:16px;
}
.divider::before,.divider::after{content:"";height:1px;background:#D8DCE5}
.providers{display:flex;justify-content:center;gap:64px}
.provider{
  border:0;
  background:transparent;
  padding:0;
  color:#475467;
  font-size:13px;
  cursor:pointer;
  text-align:center;
}
.provider-icon{
  width:58px;
  height:58px;
  margin:0 auto 9px;
  border:1px solid #E6E8ED;
  border-radius:50%;
  background:#F7F7F8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:700;
}
.microsoft{color:#1675D1}.google{color:#4285F4}.access{color:#17233F}
.login-legal{
  margin:0;
  color:#667085;
  font-size:12px;
  line-height:1.4;
}
.login-legal a{color:var(--blue)}

@media(max-width:1050px){
  .login-page{grid-template-columns:1.45fr minmax(380px,1fr);gap:38px;padding:48px}
  .login-image,.login-content{min-height:calc(100vh - 96px)}
}
@media(max-width:800px){
  .login-page{display:block;padding:28px}
  .login-image{min-height:320px;margin-bottom:42px}
  .login-content{min-height:auto}
  .login-logo{margin-bottom:54px}
  .login-form-wrap{margin:0;transform:none}
  .login-legal{margin-top:70px}
}
@media(max-width:520px){
  .login-page{padding:18px}
  .login-image{min-height:250px;border-radius:18px}
  .login-form-wrap h1{font-size:28px;margin-bottom:34px}
  .providers{gap:32px}
}
</style>
</head>
<body>
<main class="login-page">
  <section class="login-image" aria-label="Ecosistema e-Sueldos">
    <img src="../assets/hero-suite.png" alt="Plataforma e-Sueldos para liquidación y recursos humanos">
  </section>

  <section class="login-content">
    <a class="login-logo" href="../index-esueldos.html" aria-label="Volver a e-Sueldos">
      <img src="../fondo.png" alt="e-Sueldos">
    </a>

    <div class="login-form-wrap">
      <h1>Iniciá sesión en tu comunidad</h1>
      <form>
        <div class="field">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" autofocus>
        </div>
        <button class="continue" type="submit">Continuar</button>
      </form>

      <div class="divider">O iniciá sesión con</div>

      <div class="providers" aria-label="Proveedores de acceso">
        <button class="provider" type="button">
          <span class="provider-icon microsoft">⊞</span>
          Microsoft
        </button>
        <button class="provider" type="button">
          <span class="provider-icon google">G</span>
          Google
        </button>
        <button class="provider" type="button">
          <span class="provider-icon access">◉</span>
          Acceso corporativo
        </button>
      </div>
    </div>

    <p class="login-legal">Al ingresar, estás aceptando nuestros <a href="#">Términos de uso</a> y <a href="#">Política de Privacidad</a>.</p>
  </section>
</main>
</body>
</html>

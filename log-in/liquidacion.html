<script>
(function(){
"use strict";
try{
if(!("IntersectionObserver" in window))return;
if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
var SUF=["-grid","-cards","-list","-stats","-benefits","-categories","-row","-tiles"];
var BTN_CLASSES=["demo","submit","modules-more"];
var ROLE={
  title:{y:50,s:1,dur:900,delay:0},
  text:{y:28,s:1,dur:850,delay:140},
  media:{y:80,s:.95,dur:1100,delay:80},
  button:{y:24,s:1,dur:750,delay:260},
  card:{y:46,s:1,dur:850,delay:0},
  block:{y:42,s:1,dur:850,delay:0}
};
var CARD_STAGGER=110,CARD_STAGGER_CAP=770,MAX_DEPTH=6;
function cls(el){return " "+((el.getAttribute&&el.getAttribute("class"))||"")+" ";}
function hasCls(el,name){return cls(el).indexOf(" "+name+" ")>=0;}
function isGridBox(el){
  var c=cls(el);
  for(var i=0;i<SUF.length;i++){if(c.indexOf(SUF[i]+" ")>=0)return true;}
  return false;
}
function okUnit(el){
  if(!el||el.nodeType!==1)return false;
  var t=el.tagName;
  if(t==="SCRIPT"||t==="STYLE"||t==="TEMPLATE"||t==="LINK"||t==="META"||t==="BR"||t==="IFRAME")return false;
  var c=cls(el);
  if(c.indexOf("__esueldos-cloud")>=0||c.indexOf("brief-extra-clouds")>=0)return false;
  if(el.getAttribute("aria-hidden")==="true")return false;
  var cs=window.getComputedStyle(el);
  if(cs.animationName&&cs.animationName!=="none")return false;
  if(cs.position==="fixed")return false;
  var r=el.getBoundingClientRect();
  if(r.width<=0&&r.height<=0)return false;
  return true;
}
function validChildren(el){
  var out=[];
  for(var i=0;i<el.children.length;i++){if(okUnit(el.children[i]))out.push(el.children[i]);}
  return out;
}
function classifyRole(el){
  var tag=el.tagName?el.tagName.toLowerCase():"";
  if(tag==="h1"||tag==="h2"||tag==="h3"||tag==="h4")return"title";
  if(tag==="p"||hasCls(el,"eyebrow"))return"text";
  if(tag==="a"||tag==="button"){
    for(var i=0;i<BTN_CLASSES.length;i++){if(hasCls(el,BTN_CLASSES[i]))return"button";}
    return null;
  }
  if(tag==="img"||tag==="video")return"media";
  if(tag==="svg"){
    var rs=el.getBoundingClientRect();
    if(rs.width>=48&&rs.height>=48)return"media";
    return null;
  }
  if(/visual|mockup|scene|screen|phone|device|stack|showcase/i.test(el.className&&el.className.baseVal!==undefined?el.className.baseVal:el.className||"")){
    var r=el.getBoundingClientRect();
    if(r.width>=100&&r.height>=60)return"media";
  }
  return null;
}
function isCardContainer(el){
  return isGridBox(el)&&validChildren(el).length>=3;
}
function tagRole(el,role,delay){
  if(el.hasAttribute("data-esrv"))return;
  var spec=ROLE[role]||ROLE.block;
  el.setAttribute("data-esrv",role);
  el.style.setProperty("--esrv-y",spec.y+"px");
  if(spec.s!==1)el.style.setProperty("--esrv-s",String(spec.s));
  el.style.animationDuration=spec.dur+"ms";
  el.__esDelay=delay!=null?delay:spec.delay;
  io.observe(el);
}
function processUnit(el,depth){
  if(!okUnit(el))return;
  if(isCardContainer(el)){
    var kids=validChildren(el);
    for(var i=0;i<kids.length;i++){
      tagRole(kids[i],"card",Math.min(i*CARD_STAGGER,CARD_STAGGER_CAP));
    }
    return;
  }
  var role=classifyRole(el);
  if(role){tagRole(el,role);return;}
  if(depth>=MAX_DEPTH){tagRole(el,"block");return;}
  var kids=validChildren(el);
  if(kids.length===0){
    if(el.textContent&&el.textContent.replace(/\s+/g,"")!=="")tagRole(el,"block");
    return;
  }
  for(var k=0;k<kids.length;k++)processUnit(kids[k],depth+1);
}
var io=new IntersectionObserver(function(entries){
  for(var i=0;i<entries.length;i++){
    if(!entries[i].isIntersecting)continue;
    var el=entries[i].target;
    io.unobserve(el);
    reveal(el);
  }
},{threshold:0,rootMargin:"0px 0px -8% 0px"});
function cleanup(el){
  if(el.__esDone)return;
  el.__esDone=true;
  el.removeAttribute("data-esrv");
  el.removeAttribute("data-esrv-on");
  el.style.removeProperty("--esrv-y");
  el.style.removeProperty("--esrv-s");
  el.style.removeProperty("animation-duration");
  el.style.removeProperty("animation-delay");
  if(!el.getAttribute("style"))el.removeAttribute("style");
}
function reveal(el){
  if(el.__esDelay)el.style.animationDelay=el.__esDelay+"ms";
  el.setAttribute("data-esrv-on","");
  var onEnd=function(ev){
    if(ev.target!==el)return;
    if(String(ev.animationName)!=="es-rv")return;
    el.removeEventListener("animationend",onEnd);
    cleanup(el);
  };
  el.addEventListener("animationend",onEnd);
  window.setTimeout(function(){cleanup(el)},2000+(el.__esDelay||0));
}
function start(){
  var roots=document.querySelectorAll("section,footer");
  for(var r=0;r<roots.length;r++){
    var sec=roots[r];
    var base=null;
    for(var i=0;i<sec.children.length;i++){
      if(sec.children[i].classList&&sec.children[i].classList.contains("wrap")){base=sec.children[i];break;}
    }
    base=base||sec;
    var kids=validChildren(base);
    for(var k=0;k<kids.length;k++)processUnit(kids[k],0);
  }
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",start);}else{start();}
}catch(e){}
})();
</script>
